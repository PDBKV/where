[build-system]
requires = [
  "scikit-build-core>=1.0", "numpy", 
  "f2py-cmake", "cython>=3.0", 
  "cython-cmake", "requests", "pycurl"
]
build-backend = "scikit_build_core.build"

[project]
name = "where"
dynamic = ["version"]
description = "Where, analysis of space geodetic data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Norwegian Mapping Authority", email = "ann-silje.kirkvik@kartverket.no"}]
keywords = ["referenceframe","vlbi","slr","gnss"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cartopy",
  "colorama",
  "folium",
  "h5py",
  "ipython",
  "jplephem",
  "matplotlib>=3.1.1",
  "midgard>=1.3.0",
  "netCDF4",
  "numpy>=1.26",
  "pandas",
  "pint",
  "pycurl",
  "editor",
  "requests",
  "scipy",
  "seaborn",
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "config/download_*.conf"},
  { file = "where/models/orbit/*.pyx"},
  { file = "where/integrators/*.pyx"}
]
no-build-isolation-package = ["where"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
wheel.packages = ["where"]
editable.mode = "redirect"        # the default, stated for clarity

[[tool.scikit-build.overrides]]
if.state = "^editable$"
build-dir = "build/editable"
editable.rebuild = false

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "where/__init__.py"

[tool.uv.sources]
midgard = { git = "https://github.com/kartverket/midgard", branch = "master" }

[project.urls]
Homepage = "https://github.com/kartverket/where"

[project.scripts]
where          = "where.__main__:main"
where_profiler = "where.tools.profiler:profiler"
where_runner   = "where.runner:main"
there          = "where.there:main"
where_tools    = "where.tools:main"

[dependency-groups]
dev = [
  "scikit-build-core>=1.0", "cmake", "ninja",
  "cython-cmake", "numpy>=2.0", "cython>=3.0",
  "black", "bump-my-version", "flake8", 
  "line_profiler", "mypy", "pytest", 
  "pytest-cov", "f2py-cmake",
]
docs = ["markdown", "pelican"]
